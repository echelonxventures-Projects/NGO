# Local infrastructure: PostgreSQL + Redis. Free, self-hosted, no external services.
# Usage: npm run infra:up   (from repo root)
services:
  postgres:
    image: postgres:16-alpine
    container_name: dxp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dxp
      POSTGRES_PASSWORD: dxp
      POSTGRES_DB: dxp
    ports:
      - "5433:5432"
    volumes:
      - dxp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dxp -d dxp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dxp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dxp_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dxp_pgdata:
  dxp_redisdata:
