# Full-stack production-style stack: Postgres + Redis + API + Web.
# Usage (from repo root):
#   docker compose -f infra/docker-compose.prod.yml up -d --build
# Free-first: all images are open-source; no external managed services required.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dxp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxp}
      POSTGRES_DB: ${POSTGRES_DB:-dxp}
    volumes:
      - dxp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dxp} -d ${POSTGRES_DB:-dxp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - dxp_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-dxp}:${POSTGRES_PASSWORD:-dxp}@postgres:5432/${POSTGRES_DB:-dxp}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-platform.local}
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  dxp_pgdata:
  dxp_redisdata:
